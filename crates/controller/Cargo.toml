[package]
name = "krusty-kms-controller"
version = "0.4.2"
edition = "2021"
rust-version = "1.92"
authors = ["Krusty KMS Contributors"]
license = "MIT OR Apache-2.0"
description = "Cartridge Controller wallet integration for krusty-kms"
repository = "https://github.com/starknet-innovation/kms"
homepage = "https://github.com/starknet-innovation/kms"
keywords = ["cryptography", "kms", "starknet", "encryption"]
categories = ["cryptography"]
# Cannot publish: `account_sdk` has no crates.io release.
publish = false

[dependencies]
krusty-kms-common = { path = "../common" }
krusty-kms-wallet-api = { path = "../wallet-api" }
starknet-types-core = { version = "0.2.0", features = ["hash"] }
starknet-rust = "0.18.0"
tokio = { version = "1.43.0", features = ["sync"] }
async-trait = "0.1"
url = "2.5"

# Cartridge Controller SDK (git-only, not on crates.io)
account_sdk = { git = "https://github.com/cartridge-gg/controller-rs.git", tag = "v0.10.1", optional = true }
starknet = { version = "0.17.0", optional = true }

[features]
default = []
sdk = ["dep:account_sdk", "dep:starknet"]
