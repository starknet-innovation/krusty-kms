[package]
name = "krusty-kms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Deterministic key derivation, account descriptors, and Stark/Nostr signing for krusty-kms"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["parallel"]
parallel = ["krusty-kms-crypto/parallel"]

[dependencies]
krusty-kms-common = { version = "2.0.0", path = "../common" }
krusty-kms-crypto = { version = "2.0.0", path = "../crypto", default-features = false }
starknet-types-core.workspace = true
starknet-rust-core.workspace = true
bip39.workspace = true
# RIPEMD-160 for P2WPKH key hashes; already in the graph through bip39.
bitcoin_hashes = { version = "0.14.1", default-features = false }
# `zeroize` makes SHA-2 hashers wipe their state on drop; zeroizing_hmac requires it.
sha2 = { workspace = true, features = ["zeroize"] }
sha3 = "0.12"
num-bigint.workspace = true
crypto-bigint.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
getrandom = "0.4"
k256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
# RFC 6979 with additional data, for Bitcoin low-R grinding; the ecdsa k256 uses.
ecdsa = { version = "0.17.0", default-features = false, features = ["algorithm"] }
starknet-crypto.workspace = true
zeroize.workspace = true
subtle.workspace = true
chacha20poly1305.workspace = true
scrypt.workspace = true
aes.workspace = true
ctr.workspace = true
base64.workspace = true
# `zeroize` wipes the cipher state holding each NIP-44 message key on drop.
chacha20 = { workspace = true, features = ["zeroize"] }

[dev-dependencies]
# Differential oracle for zeroizing_hmac; production HMACs do not use it.
hmac.workspace = true

[lints]
workspace = true
