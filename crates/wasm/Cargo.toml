[package]
name = "krusty-kms-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "WASM bindings for krusty-kms account and protocol utilities"
keywords.workspace = true
categories.workspace = true
# This crate is distributed through npm as a wasm-pack package. Keep the Rust
# crate private while using the repository URL in the generated npm metadata.
repository = "git+https://github.com/starknet-innovation/krusty-kms.git"
homepage = "https://github.com/starknet-innovation/krusty-kms"
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Internal crates
krusty-kms-sdk = { version = "0.7.0", path = "../sdk", default-features = false }
krusty-kms-common = { version = "0.7.0", path = "../common" }
krusty-kms-crypto = { version = "0.7.0", path = "../crypto", default-features = false }
krusty-kms = { version = "0.7.0", path = "../kms", default-features = false }

# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
hex.workspace = true
sha3.workspace = true

# Starknet types (need for Felt operations)
starknet-types-core.workspace = true

# Crypto
rand.workspace = true
rand_core.workspace = true
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
