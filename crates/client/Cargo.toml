[package]
name = "krusty-kms-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Focused Starknet wallet, deployment, and Tongo protocol client for krusty-kms"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = []
nats = ["dep:async-nats", "dep:bytes"]

[dependencies]
krusty-kms-common = { version = "0.11.0", path = "../common" }
krusty-kms-wallet-api = { version = "0.11.0", path = "../wallet-api" }
krusty-kms = { version = "0.11.0", path = "../kms" }
krusty-kms-sdk = { version = "0.11.0", path = "../sdk" }
krusty-kms-crypto = { version = "0.11.0", path = "../crypto" }
starknet-types-core.workspace = true
starknet-rust.workspace = true
tokio = { workspace = true, features = ["time", "sync", "macros", "net", "rt"] }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
async-nats = { version = "0.50.0", optional = true }
bytes = { version = "1", optional = true }
futures-util = "0.3"
bs58 = "0.5"
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[[example]]
name = "oz_multisig_coordination"
required-features = ["nats"]

[[test]]
name = "nats_multisig_coordinator"
required-features = ["nats"]

[lints]
workspace = true
