# Dependabot configuration. Keeps the dependency stack patched so security
# fixes in transitive deps (RNG stacks, TLS, serde, ...) land promptly.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch semver-compatible bumps to keep review load manageable;
      # security updates always arrive as individual PRs.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 0.1.26 moves to Unicode 18 tables, which changes BIP-39 seeds for some
      # passphrases. Keep the lockfile on 0.1.25 until a versioned derivation
      # and recovery path exist; see
      # docs/design/2026-11-18-stable-mnemonic-normalization.md.
      - dependency-name: "unicode-normalization"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init, autobuild and analyze must run the same CodeQL version; separate
      # PRs each mix two versions and fail.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "npm"
    directory: "/cross-tests"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/packages/kms-jvm"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pub"
    directory: "/packages/kms-dart"
    schedule:
      interval: "weekly"

  - package-ecosystem: "swift"
    directory: "/packages/kms-swift"
    schedule:
      interval: "weekly"
