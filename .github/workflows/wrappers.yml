name: Wrappers

on:
  push:
    paths:
      - "packages/**"
      - ".github/workflows/wrappers.yml"
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/wrappers.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      jvm: ${{ steps.filter.outputs.jvm }}
      dart: ${{ steps.filter.outputs.dart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            swift:
              - 'packages/kms-swift/**'
              - 'packages/kms-c/**'
            jvm:
              - 'packages/kms-jvm/**'
              - 'packages/kms-c/**'
            dart:
              - 'packages/kms-dart/**'
              - 'packages/kms-c/**'

  swift:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-14
    defaults:
      run:
        working-directory: packages/kms-swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift build

  jvm:
    needs: changes
    if: needs.changes.outputs.jvm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kms-jvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "8.10"
      - run: gradle classes

  # The Gradle build only compiles Java; kms_jni.c is built out-of-band.
  # Syntax-check it on both platforms so the __APPLE__ (memset_s) and
  # __linux__ (explicit_bzero) branches both stay compilable.
  jni-c-syntax:
    needs: changes
    if: needs.changes.outputs.jvm == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Syntax-check JNI C sources
        run: |
          JNI_INCLUDE="$JAVA_HOME/include"
          if [ "$RUNNER_OS" = "macOS" ]; then
            JNI_OS_INCLUDE="$JAVA_HOME/include/darwin"
          else
            JNI_OS_INCLUDE="$JAVA_HOME/include/linux"
          fi
          cc -fsyntax-only -Wall -Wextra \
            -I"$JNI_INCLUDE" -I"$JNI_OS_INCLUDE" \
            -Ipackages/kms-jvm/src/main/c \
            packages/kms-jvm/src/main/c/kms_jni.c
      # The UTF-16 -> standard UTF-8 conversion is JNI-free precisely so it can
      # be executed here: it decides which bytes the passphrase KDF sees, and a
      # divergence from Swift/Dart/Rust makes funds unreachable (M-22).
      - name: Run JNI UTF-8 conversion tests
        run: |
          cc -Wall -Wextra -Werror -o /tmp/utf16_to_utf8_test \
            packages/kms-jvm/src/test/c/utf16_to_utf8_test.c
          /tmp/utf16_to_utf8_test

  dart:
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kms-dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      - run: dart analyze
      - run: dart test
