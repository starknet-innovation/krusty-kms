name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: crates-io-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Gate publishing on the same checks CI runs: a tag push must never ship
  # code that does not build, pass tests, or clear the dependency audit.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Mirror the `check` job in rust.yml exactly: krusty-kms-wasm is covered
      # by `wasm-pack test`, not native cargo test. This job only runs on tag
      # pushes, so it never gets exercised on a PR — keep it identical to the
      # command CI proves on every commit rather than a variant of it.
      - run: cargo test --workspace --locked --exclude krusty-kms-wasm
      - run: cargo test -p krusty-kms-client --locked --features nats
      - run: cargo install cargo-audit --version 0.22.1 --locked
      - run: cargo audit --deny warnings
      - run: cargo install cargo-deny --version 0.19.8 --locked
      - run: cargo deny check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # The environment is the only thing standing between a pushed tag and a
      # crates.io token, so refuse to continue unless its protection rules are
      # actually configured (mirrors the npm publish job). Releases are
      # tag-triggered, so the deployment policy must admit exactly the `v*`
      # tag pattern; the branch check below then ties the tag to main.
      - name: Require a protected crates-io environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="${RUNNER_TEMP}/crates-io-environment.json"
          branch_policies_json="${RUNNER_TEMP}/crates-io-branch-policies.json"
          gh api "repos/${GITHUB_REPOSITORY}/environments/crates-io" > "${environment_json}"
          gh api \
            "repos/${GITHUB_REPOSITORY}/environments/crates-io/deployment-branch-policies?per_page=100" \
            > "${branch_policies_json}"
          node - "${environment_json}" "${branch_policies_json}" <<'NODE'
          const fs = require("node:fs");
          const environment = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const policies = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const reviewerRule = environment.protection_rules?.find(
            (rule) => rule.type === "required_reviewers",
          );
          if (!reviewerRule?.reviewers?.length) {
            throw new Error("the crates-io environment must have at least one required reviewer");
          }
          const branchPolicy = environment.deployment_branch_policy;
          if (!branchPolicy?.custom_branch_policies || branchPolicy.protected_branches) {
            throw new Error("the crates-io environment must use a custom v*-tag-only deployment policy");
          }
          const branchPolicies = policies.branch_policies ?? [];
          if (
            policies.total_count !== 1 ||
            branchPolicies.length !== 1 ||
            branchPolicies[0].name !== "v*" ||
            branchPolicies[0].type !== "tag"
          ) {
            throw new Error("the crates-io environment must allow exactly the v* tag pattern");
          }
          NODE
      - name: Verify release commit is reachable from main
        shell: bash
        run: |
          git fetch origin main

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::release tag must point to a commit reachable from main"
            exit 1
          fi
      - name: Verify release tag matches the workspace version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "krusty-kms") | .version')"
          expected_tag="v${version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not match workspace version ${expected_tag}"
            exit 1
          fi
      - name: Verify release changelog
        run: bash .github/scripts/verify-release-changelog.sh
      - name: Verify publishable workspace crates
        run: >
          cargo package --locked --workspace
          --exclude krusty-kms-oracle
          --exclude krusty-kms-wasm
          --exclude krusty-kms-cabi
          --exclude mental-poker
          --exclude mental-poker-wasm
          --exclude qb-game
      - name: Authenticate with crates.io
        id: auth
        shell: bash
        run: |
          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crates.io")"
          oidc_token="$(jq --exit-status --raw-output '.value' <<<"${oidc_response}")"

          token_response="$(curl --fail --silent --show-error --request POST \
            --header "Content-Type: application/json" \
            --header "User-Agent: krusty-kms-trusted-publishing" \
            --data "$(jq --compact-output --null-input --arg jwt "${oidc_token}" '{jwt: $jwt}')" \
            https://crates.io/api/v1/trusted_publishing/tokens)"
          token="$(jq --exit-status --raw-output '.token' <<<"${token_response}")"

          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          .github/scripts/publish-crate.sh krusty-kms-common
          .github/scripts/publish-crate.sh krusty-kms-wallet-api
          .github/scripts/publish-crate.sh krusty-kms-domain
          .github/scripts/publish-crate.sh krusty-kms-crypto
          .github/scripts/publish-crate.sh krusty-kms
          .github/scripts/publish-crate.sh krusty-kms-sdk
          .github/scripts/publish-crate.sh krusty-kms-client
          .github/scripts/publish-crate.sh krusty-kms-gateway
      - name: Revoke crates.io token
        if: ${{ always() && steps.auth.outputs.token != '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: >
          curl --fail --silent --show-error --request DELETE
          --header "Authorization: Bearer ${CARGO_REGISTRY_TOKEN}"
          --header "User-Agent: krusty-kms-trusted-publishing"
          https://crates.io/api/v1/trusted_publishing/tokens
