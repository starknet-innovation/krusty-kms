name: Publish to crates.io

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "!crates/ffi/**"
      - "!crates/experimental/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/publish.yml"
      - ".github/scripts/publish-crate.sh"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish krusty-kms-common
        run: .github/scripts/publish-crate.sh krusty-kms-common
      - name: Publish krusty-kms-wallet-api
        run: .github/scripts/publish-crate.sh krusty-kms-wallet-api
      - name: Publish krusty-kms-domain
        run: .github/scripts/publish-crate.sh krusty-kms-domain
      - name: Publish krusty-kms-crypto
        run: .github/scripts/publish-crate.sh krusty-kms-crypto
      - name: Publish krusty-kms
        run: .github/scripts/publish-crate.sh krusty-kms
      - name: Publish krusty-kms-sdk
        run: .github/scripts/publish-crate.sh krusty-kms-sdk
      - name: Publish krusty-kms-client
        run: .github/scripts/publish-crate.sh krusty-kms-client
      - name: Publish krusty-kms-gateway
        run: .github/scripts/publish-crate.sh krusty-kms-gateway
