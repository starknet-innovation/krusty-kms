name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: crates-io-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Verify release commit is reachable from main
        shell: bash
        run: |
          git fetch origin main

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::release tag must point to a commit reachable from main"
            exit 1
          fi
      - name: Verify release tag matches the workspace version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "krusty-kms") | .version')"
          expected_tag="v${version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not match workspace version ${expected_tag}"
            exit 1
          fi
      - name: Verify publishable workspace crates
        run: >
          cargo package --locked --workspace
          --exclude krusty-kms-oracle
          --exclude krusty-kms-wasm
          --exclude krusty-kms-cabi
          --exclude mental-poker
          --exclude mental-poker-wasm
          --exclude qb-game
      - name: Authenticate with crates.io
        id: auth
        shell: bash
        run: |
          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crates.io")"
          oidc_token="$(jq --exit-status --raw-output '.value' <<<"${oidc_response}")"

          token_response="$(curl --fail --silent --show-error --request POST \
            --header "Content-Type: application/json" \
            --header "User-Agent: krusty-kms-trusted-publishing" \
            --data "$(jq --compact-output --null-input --arg jwt "${oidc_token}" '{jwt: $jwt}')" \
            https://crates.io/api/v1/trusted_publishing/tokens)"
          token="$(jq --exit-status --raw-output '.token' <<<"${token_response}")"

          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          .github/scripts/publish-crate.sh krusty-kms-common
          .github/scripts/publish-crate.sh krusty-kms-wallet-api
          .github/scripts/publish-crate.sh krusty-kms-domain
          .github/scripts/publish-crate.sh krusty-kms-crypto
          .github/scripts/publish-crate.sh krusty-kms
          .github/scripts/publish-crate.sh krusty-kms-sdk
          .github/scripts/publish-crate.sh krusty-kms-client
          .github/scripts/publish-crate.sh krusty-kms-gateway
      - name: Revoke crates.io token
        if: ${{ always() && steps.auth.outputs.token != '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: >
          curl --fail --silent --show-error --request DELETE
          --header "Authorization: Bearer ${CARGO_REGISTRY_TOKEN}"
          --header "User-Agent: krusty-kms-trusted-publishing"
          https://crates.io/api/v1/trusted_publishing/tokens
