name: Publish WASM package to npm

on:
  push:
    branches: [main]
    paths:
      - "crates/common/**"
      - "crates/crypto/**"
      - "crates/kms/**"
      - "crates/sdk/**"
      - "crates/wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/scripts/publish-npm.sh"
      - ".github/workflows/publish-npm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate npm publishing on tests and the dependency audit: a merge to main
  # must never ship a wasm package whose Rust sources fail CI checks.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: rustup target add wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
      # krusty-kms-wasm is excluded from the native run because its tests only
      # execute under wasm-pack (see rust.yml).
      - run: cargo test --workspace --locked --exclude krusty-kms-wasm
      # ...so the wasm package — the artifact this workflow publishes — must be
      # tested here explicitly. `publish` only gates on this job, and
      # workflow_dispatch bypasses rust.yml's parallel wasm job entirely, so
      # without this a wasm-only regression could reach npm untested. Building
      # and `npm pack --dry-run` in the publish job are not a substitute.
      - run: wasm-pack test --node crates/wasm
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: rustup target add wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
      - name: Build @starknetfoundation/krusty-kms-wasm
        run: >
          wasm-pack build --release --target web --scope starknetfoundation
          --out-dir pkg
        working-directory: crates/wasm
      - name: Inspect npm package
        run: npm pack --dry-run
        working-directory: crates/wasm/pkg
      - name: Upload verified npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krusty-kms-wasm-${{ github.sha }}
          path: crates/wasm/pkg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download verified npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: krusty-kms-wasm-${{ github.sha }}
          path: crates/wasm/pkg
      - name: Publish npm package
        run: bash .github/scripts/publish-npm.sh crates/wasm/pkg
