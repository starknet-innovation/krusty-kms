name: Cross-SDK Compatibility

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/common/**"
      - "crates/crypto/**"
      - "crates/sdk/**"
      - "cross-tests/**"
      - ".github/workflows/cross-compat.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/common/**"
      - "crates/crypto/**"
      - "crates/sdk/**"
      - "cross-tests/**"
      - ".github/workflows/cross-compat.yml"

permissions:
  contents: read

jobs:
  cross-compat:
    name: Verify Rust proofs with TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Generate cross-compat vectors from Rust
        run: cargo test -p krusty-kms-sdk --test cross_compat -- --ignored --nocapture

      - name: Install cross-tests dependencies
        working-directory: cross-tests
        run: npm ci

      - name: Verify Rust proofs with TypeScript
        working-directory: cross-tests
        run: npx tsx src/verify-rust-proofs.ts
