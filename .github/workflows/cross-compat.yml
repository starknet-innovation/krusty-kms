name: Cross-SDK Compatibility

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/common/**"
      - "crates/crypto/**"
      - "crates/kms/**"
      - "crates/sdk/**"
      - "cross-tests/**"
      - ".github/workflows/cross-compat.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/common/**"
      - "crates/crypto/**"
      - "crates/kms/**"
      - "crates/sdk/**"
      - "cross-tests/**"
      - ".github/workflows/cross-compat.yml"

permissions:
  contents: read

jobs:
  cross-compat:
    name: Verify Rust proofs with TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Generate cross-compat vectors from Rust
        run: cargo test -p krusty-kms-sdk --test cross_compat -- --ignored --nocapture

      - name: Install cross-tests dependencies
        working-directory: cross-tests
        run: npm ci

      - name: Verify Rust proofs with TypeScript
        working-directory: cross-tests
        run: npx tsx src/verify-rust-proofs.ts

      - name: Verify SNIP-12 vectors with starknet.js
        working-directory: cross-tests
        run: npm run verify:snip12
