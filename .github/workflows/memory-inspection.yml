name: Mnemonic memory inspection

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/check.sh"
      - "tools/memory-inspection/**"
      - ".github/workflows/memory-inspection.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/check.sh"
      - "tools/memory-inspection/**"
      - ".github/workflows/memory-inspection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-inspection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Memory (${{ matrix.backend }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: native
            os: ubuntu-24.04
          - backend: native
            os: macos-15
          - backend: wasm
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - if: matrix.backend == 'wasm'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - if: matrix.backend == 'wasm'
        name: Install the locked WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          bash .github/scripts/install-wasm-bindgen-cli.sh
      - name: Check standalone probe formatting
        env:
          BACKEND: ${{ matrix.backend }}
        run: cargo fmt --manifest-path "tools/memory-inspection/${BACKEND}/Cargo.toml" -- --check
      - name: Compare scrubbed and disabled-scrub optimized builds
        env:
          BACKEND: ${{ matrix.backend }}
          KMS_MEMORY_REPORT_DIR: artifacts/memory
        run: bash tools/check.sh "memory-${BACKEND}"
      - name: Retain count-only inspection reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-${{ matrix.backend }}-${{ matrix.os }}
          path: artifacts/memory/*.json
          if-no-files-found: error
          retention-days: 14
