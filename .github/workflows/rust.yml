name: Rust

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - ".github/scripts/check-release-version-base.sh"
      - ".github/scripts/verify-release-changelog.sh"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - ".github/scripts/check-release-version-base.sh"
      - ".github/scripts/verify-release-changelog.sh"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p krusty-kms-client --all-targets --features nats -- -D warnings
      - run: cargo check -p krusty-kms --examples --locked
      - run: cargo check -p krusty-kms-sdk --examples --locked
      - run: cargo test --workspace --exclude krusty-kms-wasm
      - run: cargo test -p krusty-kms-client --features nats

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.92.0
      - run: cargo check --all-targets --locked
      - run: cargo check -p krusty-kms-client --all-targets --features nats --locked
      - run: cargo check -p krusty-kms --examples --locked
      - run: cargo check -p krusty-kms-sdk --examples --locked

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Package publishable workspace crates
        run: >
          cargo package --locked --workspace
          --exclude krusty-kms-oracle
          --exclude krusty-kms-wasm
          --exclude krusty-kms-cabi
          --exclude mental-poker
          --exclude mental-poker-wasm
          --exclude qb-game

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: rustup target add wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
      - run: wasm-pack test --node crates/wasm

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a release version to start from crates.io
        run: |
          if git diff -U0 origin/${{ github.base_ref }}...HEAD -- Cargo.toml \
            | grep -Eq '^\+[[:space:]]*version[[:space:]]*='; then
            bash .github/scripts/check-release-version-base.sh "origin/${{ github.base_ref }}"
          fi
      - name: Require a changelog entry for version bumps
        run: |
          if git diff -U0 origin/${{ github.base_ref }}...HEAD -- Cargo.toml \
            | grep -Eq '^\+[[:space:]]*version[[:space:]]*='; then
            bash .github/scripts/verify-release-changelog.sh
          fi
