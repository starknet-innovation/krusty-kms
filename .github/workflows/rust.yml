name: Rust

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - "tools/check.sh"
      - ".github/scripts/check-release-version-base.sh"
      - ".github/scripts/verify-release-changelog.sh"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - "tools/check.sh"
      - ".github/scripts/check-release-version-base.sh"
      - ".github/scripts/verify-release-changelog.sh"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - run: bash tools/check.sh fmt
      - run: bash tools/check.sh lint
      - run: bash tools/check.sh examples
      - run: bash tools/check.sh test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.92.0
      - run: cargo check --all-targets --locked
      - run: cargo check -p krusty-kms-client --all-targets --features nats --locked
      - run: cargo check -p krusty-kms --examples --locked
      - run: cargo check -p krusty-kms-sdk --examples --locked

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Package publishable workspace crates
        run: >
          cargo package --locked --workspace
          --exclude krusty-kms-oracle
          --exclude krusty-kms-wasm
          --exclude krusty-kms-cabi
          --exclude mental-poker
          --exclude mental-poker-wasm
          --exclude qb-game

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo install cargo-audit --version 0.22.1 --locked
      - run: cargo audit --deny warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: rustup target add wasm32-unknown-unknown
      # Build wasm-pack from its crates.io release rather than downloading a
      # prebuilt binary: the version and its lockfile are both content-addressed.
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: bash tools/check.sh wasm

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Branch names reach the shell through `env`, never through `${{ }}`
      # interpolation inside `run:`, so a crafted ref cannot inject commands.
      - name: Require a release version to start from crates.io
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff -U0 "origin/${BASE_REF}...HEAD" -- Cargo.toml \
            | grep -Eq '^\+[[:space:]]*version[[:space:]]*='; then
            bash .github/scripts/check-release-version-base.sh "origin/${BASE_REF}"
          fi
      - name: Require a changelog entry for version bumps
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff -U0 "origin/${BASE_REF}...HEAD" -- Cargo.toml \
            | grep -Eq '^\+[[:space:]]*version[[:space:]]*='; then
            bash .github/scripts/verify-release-changelog.sh
          fi
