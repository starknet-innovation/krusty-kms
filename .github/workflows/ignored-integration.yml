name: Ignored integration tests

# Optional / bitrot-protection suite for `--ignored` tests that need external
# services (devnet, NATS, Sepolia RPC, scarb). Default CI never runs these.
#
# `list` / `compile` run on hosted runners. `nats` starts a NATS container on
# demand. `sepolia` and `multisig-devnet` require network secrets / a local
# stack and must be dispatched with a provisioned self-hosted runner label via
# the `runner` input (hosted `ubuntu-latest` will fail fast for those suites).

on:
  workflow_dispatch:
    inputs:
      suite:
        description: >
          Suite to run. list/compile work on hosted runners; nats uses a service
          container; sepolia/multisig-devnet need external RPC/devnet (self-hosted
          or pre-provisioned).
        required: true
        default: "list"
        type: choice
        options:
          - list
          - compile
          - nats
          - sepolia
          - multisig-devnet
      runner:
        description: >
          Runner label. Use ubuntu-latest for list/compile/nats. sepolia and
          multisig-devnet require a provisioned self-hosted runner (e.g. a label
          matching your pre-installed devnet/RPC stack).
        required: false
        default: "ubuntu-latest"
        type: string
  schedule:
    # Mondays 06:15 UTC — compile-only bitrot check (no external services).
    - cron: "15 6 * * 1"

permissions:
  contents: read

jobs:
  ignored:
    name: Ignored suite (${{ inputs.suite || 'compile' }})
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: List ignored tests
        if: ${{ github.event_name == 'schedule' || inputs.suite == 'list' || inputs.suite == 'compile' }}
        run: |
          cargo test --workspace --exclude krusty-kms-wasm -- --ignored --list
          cargo test -p krusty-kms-client --features nats -- --ignored --list

      - name: Compile ignored targets (no run)
        if: ${{ github.event_name == 'schedule' || inputs.suite == 'compile' }}
        run: |
          # Ensures ignored integration harnesses keep compiling.
          cargo test --workspace --exclude krusty-kms-wasm --no-run
          cargo test -p krusty-kms-client --features nats --no-run

      - name: NATS multisig coordinator
        if: ${{ inputs.suite == 'nats' }}
        env:
          NATS_URL: nats://127.0.0.1:4222
        run: |
          # Digest of the nats:2.10 multi-arch index (Docker Hub, 2026-09-02).
          docker run -d --name nats --rm -p 4222:4222 \
            nats:2.10@sha256:5498ba57b9471840be3d15b033a4eec554d1c02fa6c2cc0ca2d888637f6c6e2f
          trap 'docker stop nats' EXIT
          cargo test -p krusty-kms-client --features nats --test nats_multisig_coordinator -- --ignored --nocapture

      - name: Live Sepolia Tongo integration (requires provisioned runner)
        if: ${{ inputs.suite == 'sepolia' }}
        env:
          RUNNER_LABEL: ${{ inputs.runner || 'ubuntu-latest' }}
        run: |
          if [ "$RUNNER_LABEL" = "ubuntu-latest" ]; then
            echo "::error::Suite 'sepolia' requires a provisioned runner with Starknet Sepolia RPC access."
            echo "Re-dispatch this workflow and set the 'runner' input to your self-hosted runner label."
            exit 1
          fi
          cargo test -p krusty-kms-client --test tongo_sepolia_integration -- --ignored --nocapture

      - name: OpenZeppelin multisig on starknet-devnet (requires provisioned runner)
        if: ${{ inputs.suite == 'multisig-devnet' }}
        env:
          RUNNER_LABEL: ${{ inputs.runner || 'ubuntu-latest' }}
        run: |
          if [ "$RUNNER_LABEL" = "ubuntu-latest" ]; then
            echo "::error::Suite 'multisig-devnet' requires a provisioned runner (starknet-devnet on 127.0.0.1:5050, scarb, sncast)."
            echo "Re-dispatch this workflow and set the 'runner' input to your self-hosted runner label."
            exit 1
          fi
          cargo test -p krusty-kms-client --test oz_multisig_devnet -- --ignored --nocapture
