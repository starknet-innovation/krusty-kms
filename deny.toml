# cargo-deny configuration for krusty-kms.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "wasm32-unknown-unknown" },
]
# Audit optional features on publishable crates (e.g. krusty-kms-client `nats`).
# crates/controller is workspace-excluded and is not part of this graph.
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # Present via transitive crates (e.g. some crypto/util deps). Prefer not to
    # expand further without discussion — CC0 has no patent grant.
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
# Every duplicate below is forced by a third-party stack that has not moved to
# the generation krusty uses (RustCrypto 0.11, rand 0.10, syn 3). Each entry
# names the transitive path; when cargo-deny reports a skip that no longer
# matches anything, delete it instead of leaving a stale allowance. Prefer
# `skip` over `skip-tree`: a subtree skip would also accept duplicates added
# later underneath it. See docs/supply-chain.md.
skip = [
    # starknet-rust-signers 0.19.1 -> eth-keystore 0.5.0 (Ethereum keystore
    # loading, never exercised by krusty) pins the RustCrypto 0.10 generation
    # and thiserror 1.
    { crate = "aes@0.8", reason = "eth-keystore 0.5 via starknet-rust-signers 0.19.1; krusty-kms uses aes 0.9" },
    { crate = "cipher@0.4", reason = "aes 0.8 / ctr 0.9 via eth-keystore 0.5" },
    { crate = "crypto-common@0.1", reason = "cipher 0.4 via eth-keystore 0.5" },
    { crate = "inout@0.1", reason = "cipher 0.4 via eth-keystore 0.5" },
    { crate = "ctr@0.9", reason = "eth-keystore 0.5 via starknet-rust-signers 0.19.1; krusty-kms uses ctr 0.10" },
    { crate = "scrypt@0.10", reason = "eth-keystore 0.5 via starknet-rust-signers 0.19.1; krusty-kms uses scrypt 0.12" },
    { crate = "salsa20@0.10", reason = "scrypt 0.10 via eth-keystore 0.5" },
    { crate = "pbkdf2@0.11", reason = "eth-keystore 0.5 via starknet-rust-signers 0.19.1; krusty-kms uses pbkdf2 0.13 via scrypt 0.12" },
    { crate = "thiserror@1", reason = "eth-keystore 0.5 via starknet-rust-signers 0.19.1; everything else is on thiserror 2" },
    { crate = "thiserror-impl@1", reason = "thiserror 1 via eth-keystore 0.5" },
    # starknet-rust-crypto 0.19.1 (used by krusty-kms and the starknet-rust
    # stack) is built on RustCrypto 0.10 traits; krusty crates are on 0.11.
    { crate = "hmac@0.12", reason = "starknet-rust-crypto 0.19.1, rfc6979 0.4, eth-keystore 0.5; krusty uses hmac 0.13" },
    { crate = "sha2@0.10", reason = "starknet-rust-crypto 0.19.1, lambdaworks-crypto 0.13, ed25519-dalek 2, eth-keystore 0.5; krusty uses sha2 0.11" },
    { crate = "digest@0.10", reason = "starknet-rust-crypto 0.19.1, starknet-types-core 0.2.4, blake2 0.10, curve25519-dalek 4; krusty uses digest 0.11" },
    { crate = "block-buffer@0.10", reason = "digest 0.10" },
    { crate = "cpufeatures@0.2", reason = "sha2 0.10, aes 0.8, keccak 0.1" },
    { crate = "rfc6979@0.4", reason = "starknet-rust-crypto 0.19.1; k256 0.14 (krusty-kms) uses rfc6979 0.6" },
    # starknet-types-core 0.2.4 -> lambdaworks-math / lambdaworks-crypto 0.13
    # still use num-bigint 0.4, sha3 0.10 and rand 0.8.
    { crate = "num-bigint@0.4", reason = "lambdaworks-math 0.13, starknet-types-core 0.2.4, starknet-rust-crypto 0.19.1; krusty uses num-bigint 0.5" },
    { crate = "sha3@0.10", reason = "lambdaworks-crypto 0.13, starknet-rust-core 0.19.1, eth-keystore 0.5; krusty uses sha3 0.12" },
    { crate = "keccak@0.1", reason = "sha3 0.10" },
    { crate = "rand@0.8", reason = "lambdaworks 0.13, eth-keystore 0.5, starknet-rust-signers 0.19.1, nkeys/nuid (async-nats); krusty uses rand 0.10" },
    { crate = "rand_core@0.6", reason = "rand 0.8, rand_chacha 0.3, signatory 0.27; krusty uses rand_core 0.10" },
    # krusty-kms-wasm / mental-poker-wasm deliberately add getrandom 0.2 with
    # the `js` feature so rand_core 0.6 consumers work in browsers
    # (see crates/crypto/Cargo.toml); ring 0.17 and uuid 0.8 also need it.
    { crate = "getrandom@0.2", reason = "wasm js shim for rand_core 0.6 consumers; ring 0.17, uuid 0.8; krusty uses getrandom 0.4" },
    # async-nats 0.50 -> nkeys 0.4 -> signatory 0.27 / ed25519-dalek 2 pin the
    # pkcs8 0.10 / spki 0.7 / der 0.7 / const-oid 0.9 / signature 2 generation;
    # k256 0.14 in krusty-kms is on pkcs8 0.11 / der 0.8 / signature 3. Only
    # reachable behind krusty-kms-client's optional `nats` feature.
    { crate = "pkcs8@0.10", reason = "signatory 0.27 via nkeys 0.4 (async-nats 0.50)" },
    { crate = "spki@0.7", reason = "pkcs8 0.10 via signatory 0.27" },
    { crate = "der@0.7", reason = "pkcs8 0.10 / spki 0.7 via signatory 0.27" },
    { crate = "const-oid@0.9", reason = "der 0.7 via signatory 0.27" },
    { crate = "signature@2", reason = "ed25519 2 / ed25519-dalek 2 / signatory 0.27 via nkeys 0.4; k256 0.14 uses signature 3" },
    # The proc-macro ecosystem is mid-transition to syn 3: only async-trait
    # 0.1.92 has moved; serde_with, tokio-macros, tracing, starknet-rust macros
    # and the rest are still on syn 2.
    { crate = "syn@2", reason = "proc-macro crates other than async-trait 0.1.92 (syn 3)" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
