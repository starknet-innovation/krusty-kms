[package]
name = "krusty-native-memory-inspection"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
krusty-kms = { path = "../../../crates/kms", default-features = false }
bip39 = { version = "3.0.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
sha2 = "0.11"
zeroize = "1.9"

[profile.release]
debug = true

